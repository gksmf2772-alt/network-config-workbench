subscriber-interface "sub-doc" create
    address 10.10.10.1/24
    group-interface "grp-a" create
        dhcp
            filter 10
            server 1.1.1.1
            trusted
            no shutdown
        exit
        authentication-policy "RAD-A"
        sap lag-1 create
            ingress
                filter ip F-A
            exit
            egress
                qos QOUT-A
            exit
            sub-sla-mgmt
                sub-ident-policy "sip-a"
                no shutdown
            exit
        exit
    exit
    group-interface "grp-b" create
        dhcp
            filter 20
            server 2.2.2.2
            trusted
            no shutdown
        exit
        authentication-policy "RAD-B"
        sap lag-2 create
            ingress
                filter ip F-B
            exit
            egress
                qos QOUT-B
            exit
            sub-sla-mgmt
                sub-ident-policy "sip-b"
                no shutdown
            exit
        exit
    exit
exit
