service {
  ies "100" {
    subscriber-interface "sub-doc" {
      admin-state enable
      ipv4 {
        address 10.10.10.1 {
          prefix-length 24
        }
      }
      group-interface "grp-a" {
        radius-auth-policy "RAD-A"
        ipv4 {
          dhcp {
            admin-state enable
            filter 10
            server [1.1.1.1]
            trusted true
          }
        }
        sap lag-1 {
          ingress {
            filter {
              ip "F-A"
            }
          }
          egress {
            qos {
              sap-egress {
                policy-name "QOUT-A"
              }
            }
          }
          sub-sla-mgmt {
            admin-state enable
            sub-ident-policy "sip-a"
          }
        }
      }
      group-interface "grp-b" {
        radius-auth-policy "RAD-B"
        ipv4 {
          dhcp {
            admin-state enable
            filter 20
            server [2.2.2.2]
            trusted true
          }
        }
        sap lag-2 {
          ingress {
            filter {
              ip "F-B"
            }
          }
          egress {
            qos {
              sap-egress {
                policy-name "QOUT-B"
              }
            }
          }
          sub-sla-mgmt {
            admin-state enable
            sub-ident-policy "sip-b"
          }
        }
      }
    }
  }
}
